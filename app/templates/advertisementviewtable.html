{% extends 'stationheader.html' %}
{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .image-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px; /* Added gap for proper spacing between images */
        }
        .image-item {
            width: 120px;
            height: 130px;
            border: 1px solid #ddd;
            position: relative; /* For positioning the edit link */
            padding: 5px;
            box-sizing: border-box;
        }
        .image-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .edit-link {
            position: absolute;
            bottom: 5px;
            right: 5px;
            background-color: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 5px;
            text-decoration: none;
            border-radius: 5px;
        }
        .edit-link:hover {
            background-color: rgba(0, 0, 0, 0.8);
        }
    </style>
</head>
<body>

    <div class="image-container">
        {% for i in a %}
        <div class="image-item">
            <img src="{{i.media.url}}" alt="Image">
            <a href="{% url 'advertisement_edit' i.id %}" class="edit-link">Edit</a> 
        </div>
        {% endfor %}
    </div>

</body>
</html>
{% endblock %}
